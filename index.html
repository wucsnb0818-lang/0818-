<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎮 我的遊戲集</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: linear-gradient(145deg, #f7f0e6 0%, #e8ddd0 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 248, 240, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 48px;
            padding: 40px 36px 48px 36px;
            box-shadow: 0 20px 40px rgba(100, 70, 40, 0.2);
            border: 1px solid rgba(255, 235, 210, 0.5);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            color: #4a3a2a;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #8a7a6a;
            font-size: 15px;
            border-bottom: 1px dashed #dccfc0;
            padding-bottom: 20px;
            margin-bottom: 28px;
        }

        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .game-card {
            display: flex;
            align-items: center;
            gap: 18px;
            background: #fcf8f2;
            padding: 18px 24px;
            border-radius: 24px;
            text-decoration: none;
            color: #3f3224;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .game-card:hover {
            border-color: #b8a48a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(80, 60, 40, 0.12);
        }

        .game-icon {
            font-size: 40px;
            width: 56px;
            text-align: center;
            flex-shrink: 0;
        }

        .game-info {
            text-align: left;
            flex: 1;
        }

        .game-info .name {
            font-size: 19px;
            font-weight: 600;
            color: #3f3224;
        }

        .game-info .desc {
            font-size: 14px;
            color: #8a7a6a;
            margin-top: 2px;
        }

        .game-arrow {
            font-size: 22px;
            color: #b8a48a;
            transition: 0.2s;
        }

        .game-card:hover .game-arrow {
            transform: translateX(4px);
            color: #8a7a6a;
        }

        .footer {
            margin-top: 28px;
            font-size: 13px;
            color: #b09a86;
            border-top: 1px solid #e0d2c2;
            padding-top: 18px;
        }

        .badge {
            display: inline-block;
            background: #dccfc0;
            border-radius: 40px;
            padding: 0 14px;
            font-size: 12px;
            color: #5a4a3a;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px 32px 16px;
            }
            h1 {
                font-size: 26px;
            }
            .game-card {
                padding: 14px 16px;
            }
            .game-icon {
                font-size: 32px;
                width: 44px;
            }
            .game-info .name {
                font-size: 17px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🎮 我的遊戲集</h1>
    <div class="subtitle">挑一個遊戲，開始你的小冒險</div>

    <div class="game-grid">

        <!-- 遊戲 1：花園播種者 -->
        <a href="garden-game/" class="game-card">
            <div class="game-icon">🌸</div>
            <div class="game-info">
                <div class="name">花園播種者</div>
                <div class="desc">播種 9 格，收成 30 種花朵，賺取金幣！</div>
                <span class="badge">💰 單局金幣版</span>
            </div>
            <div class="game-arrow">→</div>
        </a>

        <!-- 遊戲 2：擲筊小遊戲 -->
        <a href="poe-game/" class="game-card">
            <div class="game-icon">🙏</div>
            <div class="game-info">
                <div class="name">擲筊問事</div>
                <div class="desc">心中默念問題，向神明請示運勢！</div>
                <span class="badge">🔮 聖筊／笑筊／陰筊</span>
            </div>
            <div class="game-arrow">→</div>
        </a>

        <!-- 💡 未來可以繼續擴充 -->
        <!--
        <a href="xxx-game/" class="game-card">
            <div class="game-icon">🎲</div>
            <div class="game-info">
                <div class="name">下一個遊戲</div>
                <div class="desc">遊戲描述</div>
                <span class="badge">標籤</span>
            </div>
            <div class="game-arrow">→</div>
        </a>
        -->

    </div>

    <div class="footer">
        🌱 持續新增中 · 每個遊戲都是獨立小世界
    </div>
</div>

</body>
</html>
