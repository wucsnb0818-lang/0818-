<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 溫柔音效板</title>
    <style>
        /* ===== 全域重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #f7f0ea;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 820px;
            width: 100%;
        }

        /* ===== 標題 ===== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            color: #7a6a5a;
            letter-spacing: 3px;
        }

        .header h1 span {
            font-weight: 600;
            color: #b8a08a;
        }

        .header .sub {
            font-size: 14px;
            color: #b09a86;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* ===== 工具列 ===== */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .toolbar .info {
            font-size: 14px;
            color: #b09a86;
        }

        .toolbar .info strong {
            color: #7a6a5a;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #e8ddd0;
            color: #5a4a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .btn-primary:hover {
            background: #dccfc0;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }

        .btn-danger {
            background: #f0e0d8;
            color: #a06050;
        }

        .btn-danger:hover {
            background: #e8d0c8;
        }

        .btn-small {
            padding: 4px 12px;
            font-size: 12px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.04);
            color: #8a7a6a;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-small:hover {
            background: rgba(0, 0, 0, 0.08);
        }

        .btn-small.danger:hover {
            background: #f0d0c8;
            color: #b06050;
        }

        /* ===== 音效網格 ===== */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        /* ===== 單個音效方塊 ===== */
        .sound-card {
            background: #fcf8f2;
            border-radius: 20px;
            padding: 16px 12px 14px 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 180, 160, 0.15);
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            min-height: 140px;
            position: relative;
            user-select: none;
        }

        .sound-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border-color: rgba(200, 180, 160, 0.3);
        }

        .sound-card:active {
            transform: scale(0.96);
        }

        /* 自訂顏色（由 JavaScript 動態設定） */
        .sound-card .card-color {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            border-radius: 20px 20px 0 0;
            background: #dccfc0;
        }

        /* 圖片區域 */
        .sound-card .card-image {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(200, 180, 160, 0.08);
            flex-shrink: 0;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .sound-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sound-card .card-image .default-icon {
            font-size: 32px;
            opacity: 0.5;
        }

        /* 名稱 */
        .sound-card .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #4a3a2a;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            max-width: 100%;
        }

        /* 操作按鈕（hover 時顯示） */
        .sound-card .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sound-card:hover .card-actions {
            opacity: 1;
        }

        .sound-card .card-actions .btn-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .sound-card .card-actions .btn-icon:hover {
            background: #fff;
            transform: scale(1.1);
        }

        .sound-card .card-actions .btn-icon.delete:hover {
            background: #f0d0c8;
            color: #b06050;
        }

        /* 空狀態（新增按鈕） */
        .sound-card.add-card {
            border: 2px dashed rgba(200, 180, 160, 0.3);
            background: rgba(252, 248, 242, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sound-card.add-card:hover {
            border-color: #b8a48a;
            background: rgba(252, 248, 242, 0.7);
            transform: translateY(-2px);
        }

        .sound-card.add-card .add-icon {
            font-size: 36px;
            opacity: 0.3;
            margin-bottom: 6px;
        }

        .sound-card.add-card .add-text {
            font-size: 14px;
            color: #b09a86;
            letter-spacing: 1px;
        }

        /* ===== 彈出視窗（Modal） ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fcf8f2;
            border-radius: 32px;
            padding: 36px 32px 32px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            0% {
                transform: scale(0.92) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 500;
            color: #4a3a2a;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-size: 13px;
            color: #8a7a6a;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .modal .form-group input[type="text"],
        .modal .form-group input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0d2c2;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            transition: 0.2s;
            color: #3f3224;
        }

        .modal .form-group input[type="text"]:focus {
            outline: none;
            border-color: #b8a48a;
            box-shadow: 0 0 0 3px rgba(200, 180, 160, 0.15);
        }

        .modal .form-group input[type="file"] {
            padding: 8px 10px;
            font-size: 13px;
            color: #8a7a6a;
        }

        .modal .form-group input[type="file"]::file-selector-button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: #e8ddd0;
            color: #5a4a3a;
            font-family: inherit;
            cursor: pointer;
            margin-right: 12px;
            transition: 0.2s;
        }

        .modal .form-group input[type="file"]::file-selector-button:hover {
            background: #dccfc0;
        }

        .modal .form-row {
            display: flex;
            gap: 12px;
        }

        .modal .form-row .form-group {
            flex: 1;
        }

        .modal .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .modal .color-picker .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal .color-picker .color-option:hover {
            transform: scale(1.1);
        }

        .modal .color-picker .color-option.active {
            border-color: #4a3a2a;
            box-shadow: 0 0 0 2px #fcf8f2;
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal .modal-actions .btn {
            flex: 1;
            text-align: center;
        }

        .modal .modal-actions .btn-secondary {
            background: #e8ddd0;
            color: #5a4a3a;
        }

        .modal .modal-actions .btn-secondary:hover {
            background: #dccfc0;
        }

        .modal .modal-actions .btn-confirm {
            background: #dccfc0;
            color: #4a3a2a;
            font-weight: 600;
        }

        .modal .modal-actions .btn-confirm:hover {
            background: #cdbcab;
        }

        .modal .preview-area {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 14px;
            background: rgba(200, 180, 160, 0.06);
            border-radius: 14px;
            margin-top: 4px;
        }

        .modal .preview-area .preview-icon {
            font-size: 28px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(200, 180, 160, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .modal .preview-area .preview-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal .preview-area .preview-name {
            font-size: 15px;
            color: #4a3a2a;
            font-weight: 500;
        }

        /* ===== 空狀態（沒有任何音效） ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b09a86;
        }

        .empty-state .icon {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
            letter-spacing: 1px;
        }

        /* ===== 響應式 ===== */
        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }

            .sound-card {
                min-height: 110px;
                padding: 12px 8px 10px 8px;
            }

            .sound-card .card-image {
                width: 44px;
                height: 44px;
                font-size: 24px;
            }

            .sound-card .card-name {
                font-size: 12px;
            }

            .modal {
                padding: 24px 18px 24px 18px;
            }

            .header h1 {
                font-size: 22px;
            }

            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .modal .form-row {
                flex-direction: column;
            }

            .sound-card .card-actions {
                opacity: 1;
            }

            .sound-card .card-actions .btn-icon {
                width: 22px;
                height: 22px;
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 10px;
            }

            .sound-card {
                min-height: 90px;
                padding: 8px 6px 8px 6px;
                border-radius: 14px;
            }

            .sound-card .card-image {
                width: 36px;
                height: 36px;
                font-size: 20px;
                border-radius: 10px;
            }

            .sound-card .card-name {
                font-size: 11px;
            }

            .sound-card.add-card .add-icon {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 標題 -->
        <div class="header">
            <h1>🎵 溫柔<span>音效板</span></h1>
            <div class="sub">點擊方塊播放 · 按一下重新開始</div>
        </div>

        <!-- 工具列 -->
        <div class="toolbar">
            <div class="info">
                📦 已使用 <strong id="countDisplay">0</strong> / 20 個
            </div>
            <div>
                <button class="btn btn-primary" id="addBtn">＋ 新增音效</button>
                <button class="btn btn-danger" id="clearBtn" style="margin-left:8px;">🗑️ 清空全部</button>
            </div>
        </div>

        <!-- 音效網格 -->
        <div class="grid" id="gridContainer">
            <!-- 由 JavaScript 動態渲染 -->
        </div>
    </div>

    <!-- ===== 彈出視窗 ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">➕ 新增音效</h2>

            <div class="form-group">
                <label>🎵 音效名稱</label>
                <input type="text" id="inputName" placeholder="例如：開心拍手" maxlength="20" />
            </div>

            <div class="form-group">
                <label>📁 上傳音檔（mp3 / wav / ogg）</label>
                <input type="file" id="inputAudio" accept="audio/*" />
                <div style="font-size:12px; color:#b09a86; margin-top:4px;">⚠️ 建議小於 5MB，過大可能載入較慢</div>
            </div>

            <div class="form-group">
                <label>🖼️ 上傳圖片（選填）</label>
                <input type="file" id="inputImage" accept="image/*" />
                <div style="font-size:12px; color:#b09a86; margin-top:4px;">不加圖片會顯示預設圖示 🎵</div>
            </div>

            <div class="form-group">
                <label>🎨 選擇顏色</label>
                <div class="color-picker" id="colorPicker">
                    <!-- 由 JS 生成 -->
                </div>
            </div>

            <!-- 預覽 -->
            <div class="preview-area" id="previewArea">
                <div class="preview-icon" id="previewIcon">🎵</div>
                <div class="preview-name" id="previewName">音效名稱</div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancel">取消</button>
                <button class="btn btn-confirm" id="modalConfirm">✓ 儲存</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 設定
            // ============================================================
            const MAX_SOUNDS = 20;
            const STORAGE_KEY = 'soundboard_data';

            // 溫柔色系
            const COLOR_PALETTE = [
                '#f5ede4', // 奶茶
                '#e8ddd0', // 杏仁
                '#dccfc0', // 燕麥
                '#f0e8d8', // 米白
                '#e8ddd8', // 粉灰
                '#d8d0c8', // 冷灰
                '#f0e0d8', // 淺粉
                '#dcc8c0', // 粉棕
                '#e0d4c8', // 卡其
                '#c8c0b8', // 灰褐
            ];

            // 預設圖片（文字 emoji）
            const DEFAULT_ICON = '🎵';

            // ============================================================
            // 2. 狀態
            // ============================================================
            let sounds = [];
            let editingIndex = null; // null = 新增模式，數字 = 編輯模式

            // ============================================================
            // 3. DOM 元素
            // ============================================================
            const grid = document.getElementById('gridContainer');
            const countDisplay = document.getElementById('countDisplay');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const inputName = document.getElementById('inputName');
            const inputAudio = document.getElementById('inputAudio');
            const inputImage = document.getElementById('inputImage');
            const colorPicker = document.getElementById('colorPicker');
            const previewIcon = document.getElementById('previewIcon');
            const previewName = document.getElementById('previewName');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            let selectedColor = COLOR_PALETTE[0];
            let imageDataUrl = null; // 暫存圖片 base64

            // ============================================================
            // 4. 儲存 / 載入
            // ============================================================
            function saveData() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(sounds));
                } catch (e) {
                    console.warn('儲存失敗（可能檔案過大）:', e);
                }
            }

            function loadData() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        sounds = JSON.parse(raw);
                        // 確保每個音效都有預設顏色
                        sounds.forEach((s, idx) => {
                            if (!s.color) {
                                s.color = COLOR_PALETTE[idx % COLOR_PALETTE.length];
                            }
                            if (!s.image) {
                                s.image = null;
                            }
                        });
                        return true;
                    }
                } catch (e) {
                    console.warn('讀取儲存失敗:', e);
                }
                return false;
            }

            // ============================================================
            // 5. 渲染
            // ============================================================
            function render() {
                const count = sounds.length;
                countDisplay.textContent = count;

                // 決定要顯示的項目：既有音效 + 一個「新增」按鈕（如果未滿）
                const items = [];
                sounds.forEach((sound, idx) => {
                    items.push({ type: 'sound', data: sound, index: idx });
                });
                if (count < MAX_SOUNDS) {
                    items.push({ type: 'add' });
                }

                if (items.length === 0) {
                    // 完全空狀態
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">🎵</div>
                            <p>還沒有音效⋯⋯<br />點擊「新增音效」來加入第一個！</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                items.forEach((item) => {
                    if (item.type === 'add') {
                        html += `
                            <div class="sound-card add-card" id="addCard">
                                <div class="add-icon">＋</div>
                                <div class="add-text">新增音效</div>
                            </div>
                        `;
                    } else {
                        const s = item.data;
                        const idx = item.index;
                        const color = s.color || COLOR_PALETTE[idx % COLOR_PALETTE.length];

                        // 圖片處理
                        let imageHtml = '';
                        if (s.image && s.image.startsWith('data:image')) {
                            imageHtml = `<img src="${s.image}" alt="${s.name}" />`;
                        } else {
                            imageHtml = `<span class="default-icon">${DEFAULT_ICON}</span>`;
                        }

                        html += `
                            <div class="sound-card" data-index="${idx}" style="border-color:${color}40;">
                                <div class="card-color" style="background:${color};"></div>
                                <div class="card-image">${imageHtml}</div>
                                <div class="card-name">${escapeHtml(s.name)}</div>
                                <div class="card-actions">
                                    <button class="btn-icon edit" data-index="${idx}" title="編輯名稱">✏️</button>
                                    <button class="btn-icon delete" data-index="${idx}" title="刪除">✕</button>
                                </div>
                            </div>
                        `;
                    }
                });

                grid.innerHTML = html;

                // 綁定事件（委託）
                // 點擊方塊播放
                grid.querySelectorAll('.sound-card:not(.add-card)').forEach(el => {
                    el.addEventListener('click', function(e) {
                        // 如果點到的是按鈕，不觸發播放
                        if (e.target.closest('.card-actions')) return;
                        const idx = parseInt(this.dataset.index);
                        if (!isNaN(idx)) {
                            playSound(idx);
                        }
                    });
                });

                // 編輯按鈕
                grid.querySelectorAll('.btn-icon.edit').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        if (!isNaN(idx)) {
                            openEditModal(idx);
                        }
                    });
                });

                // 刪除按鈕
                grid.querySelectorAll('.btn-icon.delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const idx = parseInt(this.dataset.index);
                        if (!isNaN(idx)) {
                            deleteSound(idx);
                        }
                    });
                });

                // 新增卡片
                const addCard = document.getElementById('addCard');
                if (addCard) {
                    addCard.addEventListener('click', openAddModal);
                }
            }

            // 簡單的跳脫
            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            // 6. 播放音效
            // ============================================================
            let currentAudio = null;

            function playSound(index) {
                const sound = sounds[index];
                if (!sound || !sound.audioData) {
                    console.warn('音效資料不存在');
                    return;
                }

                try {
                    // 如果已有播放中的音效，停止它
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    const audio = new Audio(sound.audioData);
                    currentAudio = audio;

                    audio.play().catch(e => {
                        console.warn('播放失敗:', e);
                    });

                    // 播放完後釋放
                    audio.onended = function() {
                        if (currentAudio === audio) {
                            currentAudio = null;
                        }
                    };

                } catch (e) {
                    console.warn('播放錯誤:', e);
                }
            }

            // ============================================================
            // 7. CRUD 操作
            // ============================================================

            // 新增
            function addSound(name, audioData, imageData, color) {
                if (sounds.length >= MAX_SOUNDS) {
                    alert(`已達上限 ${MAX_SOUNDS} 個音效！`);
                    return false;
                }
                if (!name.trim()) {
                    alert('請輸入音效名稱！');
                    return false;
                }
                if (!audioData) {
                    alert('請上傳音效檔案！');
                    return false;
                }

                sounds.push({
                    name: name.trim(),
                    audioData: audioData,
                    image: imageData || null,
                    color: color || COLOR_PALETTE[sounds.length % COLOR_PALETTE.length],
                });

                saveData();
                render();
                return true;
            }

            // 編輯名稱
            function editSound(index, newName, newImage, newColor) {
                if (index < 0 || index >= sounds.length) return false;
                if (!newName.trim()) {
                    alert('請輸入音效名稱！');
                    return false;
                }

                sounds[index].name = newName.trim();
                if (newImage !== undefined) {
                    sounds[index].image = newImage;
                }
                if (newColor) {
                    sounds[index].color = newColor;
                }

                saveData();
                render();
                return true;
            }

            // 刪除
            function deleteSound(index) {
                if (index < 0 || index >= sounds.length) return;
                if (!confirm(`確定要刪除「${sounds[index].name}」嗎？`)) return;

                // 如果正在播放這個音效，停止
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }

                sounds.splice(index, 1);
                saveData();
                render();
            }

            // 清空全部
            function clearAll() {
                if (sounds.length === 0) return;
                if (!confirm('確定要刪除全部音效嗎？此操作無法復原！')) return;

                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio.currentTime = 0;
                    currentAudio = null;
                }

                sounds = [];
                saveData();
                render();
            }

            // ============================================================
            // 8. Modal 控制
            // ============================================================

            function openModal(title, confirmText, callback) {
                modalTitle.textContent = title;
                modalConfirm.textContent = confirmText;
                modalOverlay.classList.add('active');

                // 清空表單
                inputName.value = '';
                inputAudio.value = '';
                inputImage.value = '';
                imageDataUrl = null;
                selectedColor = COLOR_PALETTE[0];
                updateColorPicker(selectedColor);
                updatePreview('🎵', '音效名稱');

                // 儲存 callback
                modalConfirm._callback = callback;
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                editingIndex = null;
            }

            // 開啟新增 Modal
            function openAddModal() {
                editingIndex = null;
                openModal('➕ 新增音效', '✓ 儲存', function() {
                    const name = inputName.value.trim();
                    const audioFile = inputAudio.files[0];
                    const imageFile = inputImage.files[0];

                    if (!name) { alert('請輸入音效名稱！'); return false; }
                    if (!audioFile) { alert('請上傳音效檔案！'); return false; }

                    // 讀取音檔
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const audioData = e.target.result;
                        // 讀取圖片（如果有）
                        let imagePromise = Promise.resolve(null);
                        if (imageFile) {
                            imagePromise = new Promise((resolve) => {
                                const imgReader = new FileReader();
                                imgReader.onload = function(ev) {
                                    resolve(ev.target.result);
                                };
                                imgReader.readAsDataURL(imageFile);
                            });
                        }

                        imagePromise.then((imageData) => {
                            addSound(name, audioData, imageData, selectedColor);
                            closeModal();
                        });
                    };
                    reader.readAsDataURL(audioFile);
                    return true;
                });
            }

            // 開啟編輯 Modal（只編輯名稱、圖片、顏色，不更換音檔）
            function openEditModal(index) {
                const sound = sounds[index];
                if (!sound) return;

                editingIndex = index;
                inputName.value = sound.name;
                selectedColor = sound.color || COLOR_PALETTE[index % COLOR_PALETTE.length];
                imageDataUrl = sound.image || null;

                // 更新預覽
                const iconHtml = sound.image && sound.image.startsWith('data:image') ?
                    `<img src="${sound.image}" />` :
                    DEFAULT_ICON;
                updatePreview(iconHtml, sound.name);
                updateColorPicker(selectedColor);

                // 清空檔案上傳
                inputAudio.value = '';
                inputImage.value = '';

                modalTitle.textContent = '✏️ 編輯音效';
                modalConfirm.textContent = '✓ 更新';

                modalOverlay.classList.add('active');

                modalConfirm._callback = function() {
                    const newName = inputName.value.trim();
                    if (!newName) { alert('請輸入音效名稱！'); return false; }

                    // 如果有上傳新圖片，使用新圖片；否則保留原圖片
                    const imageFile = inputImage.files[0];
                    if (imageFile) {
                        const imgReader = new FileReader();
                        imgReader.onload = function(e) {
                            const newImage = e.target.result;
                            editSound(index, newName, newImage, selectedColor);
                            closeModal();
                        };
                        imgReader.readAsDataURL(imageFile);
                    } else {
                        // 沒有新圖片，保留原圖或 null
                        editSound(index, newName, sound.image, selectedColor);
                        closeModal();
                    }
                    return true;
                };
            }

            // ============================================================
            // 9. 顏色選擇器
            // ============================================================

            function initColorPicker() {
                colorPicker.innerHTML = '';
                COLOR_PALETTE.forEach((color) => {
                    const div = document.createElement('div');
                    div.className = 'color-option';
                    div.style.background = color;
                    div.dataset.color = color;
                    if (color === selectedColor) div.classList.add('active');
                    div.addEventListener('click', function() {
                        selectedColor = color;
                        updateColorPicker(color);
                    });
                    colorPicker.appendChild(div);
                });
            }

            function updateColorPicker(color) {
                colorPicker.querySelectorAll('.color-option').forEach(el => {
                    el.classList.toggle('active', el.dataset.color === color);
                });
                selectedColor = color;
            }

            // ============================================================
            // 10. 預覽更新
            // ============================================================

            function updatePreview(iconHtml, name) {
                if (typeof iconHtml === 'string' && iconHtml.startsWith('<img')) {
                    previewIcon.innerHTML = iconHtml;
                } else if (typeof iconHtml === 'string' && iconHtml.startsWith('data:image')) {
                    previewIcon.innerHTML = `<img src="${iconHtml}" />`;
                } else {
                    previewIcon.innerHTML = iconHtml || DEFAULT_ICON;
                }
                previewName.textContent = name || '音效名稱';
            }

            // 監聽名稱輸入即時預覽
            inputName.addEventListener('input', function() {
                const name = this.value.trim() || '音效名稱';
                const iconHtml = imageDataUrl && imageDataUrl.startsWith('data:image') ?
                    `<img src="${imageDataUrl}" />` :
                    DEFAULT_ICON;
                updatePreview(iconHtml, name);
            });

            inputImage.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imageDataUrl = e.target.result;
                        const name = inputName.value.trim() || '音效名稱';
                        updatePreview(`<img src="${imageDataUrl}" />`, name);
                    };
                    reader.readAsDataURL(file);
                } else {
                    imageDataUrl = null;
                    const name = inputName.value.trim() || '音效名稱';
                    updatePreview(DEFAULT_ICON, name);
                }
            });

            // ============================================================
            // 11. 事件綁定
            // ============================================================

            // 新增按鈕
            addBtn.addEventListener('click', openAddModal);

            // 清空按鈕
            clearBtn.addEventListener('click', clearAll);

            // Modal 取消
            modalCancel.addEventListener('click', closeModal);

            // Modal 確認
            modalConfirm.addEventListener('click', function() {
                const callback = this._callback;
                if (callback) {
                    const result = callback();
                    if (result === false) return; // 驗證失敗
                }
            });

            // 點擊遮罩關閉
            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // 鍵盤快速鍵：ESC 關閉 Modal
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'Enter' && modalOverlay.classList.contains('active')) {
                    const callback = modalConfirm._callback;
                    if (callback) {
                        const result = callback();
                        if (result === false) return;
                    }
                }
            });

            // ============================================================
            // 12. 初始化
            // ============================================================

            function init() {
                // 載入資料
                const hasData = loadData();

                // 如果沒有資料，加入預設範例
                if (!hasData || sounds.length === 0) {
                    // 加入 3 個範例音效（用 Web Audio 產生簡單音效）
                    sounds = [];
                    // 加入範例（使用合成音效）
                    addSampleSound('🔔 叮噹', generateBellSound(), COLOR_PALETTE[0]);
                    addSampleSound('👏 拍手', generateClapSound(), COLOR_PALETTE[2]);
                    addSampleSound('🎵 和弦', generateChordSound(), COLOR_PALETTE[4]);
                    saveData();
                }

                // 初始化顏色選擇器
                initColorPicker();

                // 渲染
                render();

                console.log('🎵 溫柔音效板已載入！');
                console.log(`📦 目前有 ${sounds.length} 個音效`);
            }

            // 產生範例音效（合成）
            function generateBellSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const duration = 0.6;
                    const sampleRate = ctx.sampleRate;
                    const length = Math.floor(sampleRate * duration);
                    const buffer = ctx.createBuffer(1, length, sampleRate);
                    const data = buffer.getChannelData(0);

                    for (let i = 0; i < length; i++) {
                        const t = i / sampleRate;
                        const freq = 800 + 200 * Math.sin(t * 6);
                        const env = Math.exp(-t * 4);
                        data[i] = Math.sin(t * freq * 2 * Math.PI) * env * 0.5;
                    }

                    const blob = new Blob([bufferToWav(buffer)], { type: 'audio/wav' });
                    return URL.createObjectURL(blob);
                } catch (e) {
                    console.warn('無法生成範例音效:', e);
                    return null;
                }
            }

            function generateClapSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const duration = 0.15;
                    const sampleRate = ctx.sampleRate;
                    const length = Math.floor(sampleRate * duration);
                    const buffer = ctx.createBuffer(1, length, sampleRate);
                    const data = buffer.getChannelData(0);

                    for (let i = 0; i < length; i++) {
                        const noise = (Math.random() * 2 - 1);
                        const env = Math.exp(-i / (sampleRate * 0.03));
                        data[i] = noise * env * 0.6;
                    }

                    const blob = new Blob([bufferToWav(buffer)], { type: 'audio/wav' });
                    return URL.createObjectURL(blob);
                } catch (e) {
                    console.warn('無法生成範例音效:', e);
                    return null;
                }
            }

            function generateChordSound() {
                try {
                    const ctx = new(window.AudioContext || window.webkitAudioContext)();
                    const duration = 0.8;
                    const sampleRate = ctx.sampleRate;
                    const length = Math.floor(sampleRate * duration);
                    const buffer = ctx.createBuffer(1, length, sampleRate);
                    const data = buffer.getChannelData(0);

                    const freqs = [523, 659, 784];
                    for (let i = 0; i < length; i++) {
                        const t = i / sampleRate;
                        let val = 0;
                        freqs.forEach((f, idx) => {
                            const amp = 0.3 / (idx + 1);
                            const env = Math.exp(-t * 3);
                            val += Math.sin(t * f * 2 * Math.PI) * amp * env;
                        });
                        data[i] = val * 0.6;
                    }

                    const blob = new Blob([bufferToWav(buffer)], { type: 'audio/wav' });
                    return URL.createObjectURL(blob);
                } catch (e) {
                    console.warn('無法生成範例音效:', e);
                    return null;
                }
            }

            function bufferToWav(buffer) {
                const numChannels = buffer.numberOfChannels;
                const sampleRate = buffer.sampleRate;
                const format = 1;
                const bitDepth = 16;
                const samples = buffer.getChannelData(0);
                const dataLength = samples.length * 2;
                const headerLength = 44;
                const totalLength = headerLength + dataLength;

                const arrayBuffer = new ArrayBuffer(totalLength);
                const view = new DataView(arrayBuffer);

                const writeString = (offset, str) => {
                    for (let i = 0; i < str.length; i++) {
                        view.setUint8(offset + i, str.charCodeAt(i));
                    }
                };

                writeString(0, 'RIFF');
                view.setUint32(4, totalLength - 8, true);
                writeString(8, 'WAVE');
                writeString(12, 'fmt ');
                view.setUint32(16, 16, true);
                view.setUint16(20, format, true);
                view.setUint16(22, numChannels, true);
                view.setUint32(24, sampleRate, true);
                view.setUint32(28, sampleRate * numChannels * (bitDepth / 8), true);
                view.setUint16(32, numChannels * (bitDepth / 8), true);
                view.setUint16(34, bitDepth, true);
                writeString(36, 'data');
                view.setUint32(40, dataLength, true);

                const offset = 44;
                for (let i = 0; i < samples.length; i++) {
                    const sample = Math.max(-1, Math.min(1, samples[i]));
                    const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset + i * 2, int16, true);
                }

                return arrayBuffer;
            }

            function addSampleSound(name, audioData, color) {
                if (audioData) {
                    sounds.push({
                        name: name,
                        audioData: audioData,
                        image: null,
                        color: color || COLOR_PALETTE[sounds.length % COLOR_PALETTE.length],
                    });
                }
            }

            // ============================================================
            // 13. 啟動
            // ============================================================

            init();

            // 處理頁面關閉前清理 URL（釋放記憶體）
            window.addEventListener('beforeunload', function() {
                sounds.forEach(s => {
                    if (s.audioData && s.audioData.startsWith('blob:')) {
                        URL.revokeObjectURL(s.audioData);
                    }
                });
            });

        })();
    </script>
