<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎵 溫柔音效板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            background: #f7f0ea;
            min-height: 100vh;
            padding: 30px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 820px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 300;
            color: #7a6a5a;
            letter-spacing: 3px;
        }

        .header h1 span {
            font-weight: 600;
            color: #b8a08a;
        }

        .header .sub {
            font-size: 14px;
            color: #b09a86;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 22px;
        }

        .toolbar .info {
            font-size: 14px;
            color: #b09a86;
        }

        .toolbar .info strong {
            color: #7a6a5a;
        }

        .btn {
            padding: 10px 28px;
            border: none;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: inherit;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: #e8ddd0;
            color: #5a4a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .btn-primary:hover {
            background: #dccfc0;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.06);
        }

        .btn-danger {
            background: #f0e0d8;
            color: #a06050;
        }

        .btn-danger:hover {
            background: #e8d0c8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
        }

        .sound-card {
            background: #fcf8f2;
            border-radius: 20px;
            padding: 16px 12px 14px 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(200, 180, 160, 0.15);
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            aspect-ratio: 1 / 1;
            min-height: 140px;
            position: relative;
            user-select: none;
            touch-action: manipulation;
        }

        .sound-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            border-color: rgba(200, 180, 160, 0.3);
        }

        .sound-card:active {
            transform: scale(0.96);
        }

        .sound-card .card-color {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            border-radius: 20px 20px 0 0;
            background: #dccfc0;
        }

        .sound-card .card-image {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(200, 180, 160, 0.08);
            flex-shrink: 0;
            margin-bottom: 8px;
            overflow: hidden;
        }

        .sound-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sound-card .card-image .default-icon {
            font-size: 32px;
            opacity: 0.5;
        }

        .sound-card .card-name {
            font-size: 14px;
            font-weight: 500;
            color: #4a3a2a;
            text-align: center;
            word-break: break-word;
            line-height: 1.3;
            max-width: 100%;
        }

        .sound-card .card-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .sound-card:hover .card-actions {
            opacity: 1;
        }

        .sound-card .card-actions .btn-icon {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5a4a3a;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .sound-card .card-actions .btn-icon:hover {
            background: #fff;
            transform: scale(1.1);
        }

        .sound-card .card-actions .btn-icon.delete:hover {
            background: #f0d0c8;
            color: #b06050;
        }

        .sound-card.add-card {
            border: 2px dashed rgba(200, 180, 160, 0.3);
            background: rgba(252, 248, 242, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .sound-card.add-card:hover {
            border-color: #b8a48a;
            background: rgba(252, 248, 242, 0.7);
            transform: translateY(-2px);
        }

        .sound-card.add-card .add-icon {
            font-size: 36px;
            opacity: 0.3;
            margin-bottom: 6px;
        }

        .sound-card.add-card .add-text {
            font-size: 14px;
            color: #b09a86;
            letter-spacing: 1px;
        }

        /* ===== 拖曳狀態 ===== */
        .sound-card.dragging {
            opacity: 0.4;
            transform: scale(0.95);
            box-shadow: 0 0 0 2px #b8a48a;
        }

        .sound-card.drag-over {
            transform: scale(1.05);
            box-shadow: 0 0 0 2px #b8a48a, 0 8px 24px rgba(0, 0, 0, 0.1);
        }

        .sound-card.long-pressing {
            transform: scale(1.05);
            box-shadow: 0 0 0 3px #dccfc0, 0 12px 32px rgba(0, 0, 0, 0.12);
            z-index: 100;
            cursor: grabbing;
        }

        /* 拖曳浮動分身 */
        .drag-ghost {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.85;
            transform: scale(1.05) rotate(2deg);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            transition: none;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: #fcf8f2;
            border-radius: 32px;
            padding: 36px 32px 32px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.3s ease;
            max-height: 90vh;
            overflow-y: auto;
        }

        @keyframes modalIn {
            0% {
                transform: scale(0.92) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal h2 {
            font-size: 20px;
            font-weight: 500;
            color: #4a3a2a;
            text-align: center;
            letter-spacing: 2px;
            margin-bottom: 22px;
        }

        .modal .form-group {
            margin-bottom: 16px;
        }

        .modal .form-group label {
            display: block;
            font-size: 13px;
            color: #8a7a6a;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        .modal .form-group input[type="text"],
        .modal .form-group input[type="file"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0d2c2;
            border-radius: 14px;
            font-size: 15px;
            font-family: inherit;
            background: #fff;
            transition: 0.2s;
            color: #3f3224;
        }

        .modal .form-group input[type="text"]:focus {
            outline: none;
            border-color: #b8a48a;
            box-shadow: 0 0 0 3px rgba(200, 180, 160, 0.15);
        }

        .modal .form-group input[type="file"] {
            padding: 8px 10px;
            font-size: 13px;
            color: #8a7a6a;
        }

        .modal .form-group input[type="file"]::file-selector-button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            background: #e8ddd0;
            color: #5a4a3a;
            font-family: inherit;
            cursor: pointer;
            margin-right: 12px;
            transition: 0.2s;
        }

        .modal .form-group input[type="file"]::file-selector-button:hover {
            background: #dccfc0;
        }

        .modal .form-row {
            display: flex;
            gap: 12px;
        }

        .modal .form-row .form-group {
            flex: 1;
        }

        .modal .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }

        .modal .color-picker .color-option {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal .color-picker .color-option:hover {
            transform: scale(1.1);
        }

        .modal .color-picker .color-option.active {
            border-color: #4a3a2a;
            box-shadow: 0 0 0 2px #fcf8f2;
        }

        .modal .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal .modal-actions .btn {
            flex: 1;
            text-align: center;
        }

        .modal .modal-actions .btn-secondary {
            background: #e8ddd0;
            color: #5a4a3a;
        }

        .modal .modal-actions .btn-secondary:hover {
            background: #dccfc0;
        }

        .modal .modal-actions .btn-confirm {
            background: #dccfc0;
            color: #4a3a2a;
            font-weight: 600;
        }

        .modal .modal-actions .btn-confirm:hover {
            background: #cdbcab;
        }

        .modal .preview-area {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 14px;
            background: rgba(200, 180, 160, 0.06);
            border-radius: 14px;
            margin-top: 4px;
        }

        .modal .preview-area .preview-icon {
            font-size: 28px;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: rgba(200, 180, 160, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            overflow: hidden;
        }

        .modal .preview-area .preview-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .modal .preview-area .preview-name {
            font-size: 15px;
            color: #4a3a2a;
            font-weight: 500;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #b09a86;
        }

        .empty-state .icon {
            font-size: 48px;
            opacity: 0.3;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 16px;
            letter-spacing: 1px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #b09a86;
        }

        .loading .spinner {
            font-size: 36px;
            animation: spin 1.2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 提示條 */
        .hint-bar {
            text-align: center;
            font-size: 12px;
            color: #b09a86;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        /* 拖曳時禁止選取 */
        body.dragging-active {
            overflow: hidden;
            user-select: none;
        }

        @media (max-width: 600px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
                gap: 12px;
            }
            .sound-card {
                min-height: 110px;
                padding: 12px 8px 10px 8px;
            }
            .sound-card .card-image {
                width: 44px;
                height: 44px;
                font-size: 24px;
            }
            .sound-card .card-name {
                font-size: 12px;
            }
            .modal {
                padding: 24px 18px 24px 18px;
            }
            .header h1 {
                font-size: 22px;
            }
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }
            .modal .form-row {
                flex-direction: column;
            }
            .sound-card .card-actions {
                opacity: 1;
            }
            .sound-card .card-actions .btn-icon {
                width: 22px;
                height: 22px;
                font-size: 10px;
            }
        }

        @media (max-width: 400px) {
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
                gap: 10px;
            }
            .sound-card {
                min-height: 90px;
                padding: 8px 6px 8px 6px;
                border-radius: 14px;
            }
            .sound-card .card-image {
                width: 36px;
                height: 36px;
                font-size: 20px;
                border-radius: 10px;
            }
            .sound-card .card-name {
                font-size: 11px;
            }
            .sound-card.add-card .add-icon {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="../index.html" style="display: inline-block; color: #8a7a6a; text-decoration: none; font-size: 14px; margin-bottom: 10px; transition: 0.2s;" onmouseover="this.style.color='#5a4a3a'" onmouseout="this.style.color='#8a7a6a'">← 回到小工具</a>
        <div class="header">
            <h1>🎵 溫柔<span>音效板</span></h1>
            <div class="sub">點擊方塊播放 · 長按拖曳排序</div>
        </div>

        <div class="toolbar">
            <div class="info">
                📦 已使用 <strong id="countDisplay">0</strong> / 20 個
            </div>
            <div>
                <button class="btn btn-primary" id="addBtn">＋ 新增音效</button>
                <button class="btn btn-danger" id="clearBtn" style="margin-left:8px;">🗑️ 清空全部</button>
            </div>
        </div>

        <div class="hint-bar">💡 長按音效方塊可以拖曳調整順序</div>

        <div class="grid" id="gridContainer">
            <div class="loading">
                <div class="spinner">⏳</div>
                <p>載入中⋯⋯</p>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">➕ 新增音效</h2>

            <div class="form-group">
                <label>🎵 音效名稱</label>
                <input type="text" id="inputName" placeholder="例如：開心拍手" maxlength="20" />
            </div>

            <div class="form-group">
                <label>📁 上傳音檔（mp3 / wav / ogg）</label>
                <input type="file" id="inputAudio" accept="audio/*" />
                <div style="font-size:12px; color:#b09a86; margin-top:4px;">⚠️ 建議小於 5MB，過大可能載入較慢</div>
            </div>

            <div class="form-group">
                <label>🖼️ 上傳圖片（選填）</label>
                <input type="file" id="inputImage" accept="image/*" />
                <div style="font-size:12px; color:#b09a86; margin-top:4px;">不加圖片會顯示預設圖示 🎵</div>
            </div>

            <div class="form-group">
                <label>🎨 選擇顏色</label>
                <div class="color-picker" id="colorPicker"></div>
            </div>

            <div class="preview-area" id="previewArea">
                <div class="preview-icon" id="previewIcon">🎵</div>
                <div class="preview-name" id="previewName">音效名稱</div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="modalCancel">取消</button>
                <button class="btn btn-confirm" id="modalConfirm">✓ 儲存</button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. 設定
            // ============================================================
            const MAX_SOUNDS = 20;
            const DB_NAME = 'SoundboardDB';
            const STORE_NAME = 'sounds';
            const DB_VERSION = 1;

            const COLOR_PALETTE = [
                '#f5ede4', '#e8ddd0', '#dccfc0', '#f0e8d8', '#e8ddd8',
                '#d8d0c8', '#f0e0d8', '#dcc8c0', '#e0d4c8', '#c8c0b8',
            ];

            const DEFAULT_ICON = '🎵';
            const LONG_PRESS_DURATION = 500; // 長按 0.5 秒觸發拖曳

            // ============================================================
            // 2. 狀態
            // ============================================================
            let sounds = [];
            let editingIndex = null;
            let db = null;
            let isLoading = true;

            // 拖曳狀態
            let dragState = {
                active: false,
                startX: 0,
                startY: 0,
                currentId: null,
                longPressTimer: null,
                ghostEl: null,
                placeholderEl: null,
                originIndex: -1,
                lastOverEl: null,
            };

            // ============================================================
            // 3. DOM 元素
            // ============================================================
            const grid = document.getElementById('gridContainer');
            const countDisplay = document.getElementById('countDisplay');
            const addBtn = document.getElementById('addBtn');
            const clearBtn = document.getElementById('clearBtn');

            const modalOverlay = document.getElementById('modalOverlay');
            const modalTitle = document.getElementById('modalTitle');
            const inputName = document.getElementById('inputName');
            const inputAudio = document.getElementById('inputAudio');
            const inputImage = document.getElementById('inputImage');
            const colorPicker = document.getElementById('colorPicker');
            const previewIcon = document.getElementById('previewIcon');
            const previewName = document.getElementById('previewName');
            const modalCancel = document.getElementById('modalCancel');
            const modalConfirm = document.getElementById('modalConfirm');

            let selectedColor = COLOR_PALETTE[0];
            let imageDataUrl = null;
            let tempAudioData = null;

            // ============================================================
            // 4. IndexedDB 操作
            // ============================================================

            function openDB() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = function(e) {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    request.onsuccess = function(e) {
                        db = e.target.result;
                        resolve(db);
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function loadAllSounds() {
                return new Promise((resolve, reject) => {
                    if (!db) { reject(new Error('DB not open')); return; }
                    const tx = db.transaction(STORE_NAME, 'readonly');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = function() {
                        resolve(request.result || []);
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function saveSound(sound) {
                return new Promise((resolve, reject) => {
                    if (!db) { reject(new Error('DB not open')); return; }
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.add(sound);
                    request.onsuccess = function() {
                        resolve(request.result);
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function updateSound(id, data) {
                return new Promise((resolve, reject) => {
                    if (!db) { reject(new Error('DB not open')); return; }
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.put({ ...data, id });
                    request.onsuccess = function() {
                        resolve();
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function deleteSoundFromDB(id) {
                return new Promise((resolve, reject) => {
                    if (!db) { reject(new Error('DB not open')); return; }
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.delete(id);
                    request.onsuccess = function() {
                        resolve();
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            function clearAllSounds() {
                return new Promise((resolve, reject) => {
                    if (!db) { reject(new Error('DB not open')); return; }
                    const tx = db.transaction(STORE_NAME, 'readwrite');
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = function() {
                        resolve();
                    };
                    request.onerror = function(e) {
                        reject(e.target.error);
                    };
                });
            }

            // ============================================================
            // 5. 載入與初始化
            // ============================================================

            async function init() {
                try {
                    await openDB();
                    const data = await loadAllSounds();
                    // 按照 order 排序（如果沒有 order，則按 id）
                    sounds = data.map((item) => ({
                        id: item.id,
                        name: item.name || '未命名',
                        audioData: item.audioData || null,
                        image: item.image || null,
                        color: item.color || COLOR_PALETTE[0],
                        order: item.order !== undefined ? item.order : item.id,
                    })).sort((a, b) => a.order - b.order);

                    isLoading = false;
                    render();
                    initColorPicker();
                    console.log(`🎵 音效板已載入，共 ${sounds.length} 個音效`);
                } catch (e) {
                    console.error('初始化失敗:', e);
                    isLoading = false;
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">⚠️</div>
                            <p>載入失敗：${e.message}</p>
                        </div>
                    `;
                }
            }

            // ============================================================
            // 6. 渲染
            // ============================================================

            function render() {
                if (isLoading) return;

                const count = sounds.length;
                countDisplay.textContent = count;

                const items = [];
                sounds.forEach((sound) => {
                    items.push({ type: 'sound', data: sound });
                });
                if (count < MAX_SOUNDS) {
                    items.push({ type: 'add' });
                }

                if (items.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <div class="icon">🎵</div>
                            <p>還沒有音效⋯⋯<br />點擊「新增音效」來加入第一個！</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                items.forEach((item) => {
                    if (item.type === 'add') {
                        html += `
                            <div class="sound-card add-card" id="addCard">
                                <div class="add-icon">＋</div>
                                <div class="add-text">新增音效</div>
                            </div>
                        `;
                    } else {
                        const s = item.data;
                        const color = s.color || COLOR_PALETTE[0];

                        let imageHtml = '';
                        if (s.image && s.image.startsWith('data:image')) {
                            imageHtml = `<img src="${s.image}" alt="${s.name}" />`;
                        } else {
                            imageHtml = `<span class="default-icon">${DEFAULT_ICON}</span>`;
                        }

                        html += `
                            <div class="sound-card" data-id="${s.id}" style="border-color:${color}40;">
                                <div class="card-color" style="background:${color};"></div>
                                <div class="card-image">${imageHtml}</div>
                                <div class="card-name">${escapeHtml(s.name)}</div>
                                <div class="card-actions">
                                    <button class="btn-icon edit" data-id="${s.id}" title="編輯">✏️</button>
                                    <button class="btn-icon delete" data-id="${s.id}" title="刪除">✕</button>
                                </div>
                            </div>
                        `;
                    }
                });

                grid.innerHTML = html;

                // 綁定事件
                grid.querySelectorAll('.sound-card:not(.add-card)').forEach(el => {
                    // 點擊播放
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.card-actions')) return;
                        if (dragState.active) return;
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            playSound(id);
                        }
                    });

                    // 長按拖曳
                    setupDragEvents(el);
                });

                grid.querySelectorAll('.btn-icon.edit').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            openEditModal(id);
                        }
                    });
                });

                grid.querySelectorAll('.btn-icon.delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            deleteSound(id);
                        }
                    });
                });

                const addCard = document.getElementById('addCard');
                if (addCard) {
                    addCard.addEventListener('click', openAddModal);
                }
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // ============================================================
            // 7. 播放音效
            // ============================================================

            let currentAudio = null;

            function playSound(id) {
                const sound = sounds.find(s => s.id === id);
                if (!sound || !sound.audioData) {
                    console.warn('音效資料不存在');
                    return;
                }

                try {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                    }

                    const audio = new Audio(sound.audioData);
                    currentAudio = audio;
                    audio.play().catch(e => console.warn('播放失敗:', e));
                    audio.onended = function() {
                        if (currentAudio === audio) currentAudio = null;
                    };
                } catch (e) {
                    console.warn('播放錯誤:', e);
                }
            }

            // ============================================================
            // 8. 拖曳排序
            // ============================================================

            function setupDragEvents(el) {
                // 滑鼠事件（電腦）
                el.addEventListener('mousedown', onPointerDown);
                // 觸控事件（手機）
                el.addEventListener('touchstart', onPointerDown, { passive: true });
            }

            function onPointerDown(e) {
                // 如果點到按鈕，不觸發拖曳
                if (e.target.closest('.card-actions')) return;

                const el = e.currentTarget;
                const id = parseInt(el.dataset.id);
                if (isNaN(id)) return;

                // 取得座標
                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // 記錄起始位置
                dragState.startX = clientX;
                dragState.startY = clientY;
                dragState.currentId = id;
                dragState.originIndex = sounds.findIndex(s => s.id === id);

                // 設定長按計時器
                dragState.longPressTimer = setTimeout(() => {
                    startDrag(el, clientX, clientY);
                }, LONG_PRESS_DURATION);

                // 綁定移動和放開事件
                document.addEventListener('mousemove', onPointerMove);
                document.addEventListener('mouseup', onPointerUp);
                document.addEventListener('touchmove', onPointerMove, { passive: false });
                document.addEventListener('touchend', onPointerUp);
                document.addEventListener('touchcancel', onPointerUp);
            }

            function onPointerMove(e) {
                if (!dragState.currentId) return;

                let clientX, clientY;
                if (e.touches) {
                    clientX = e.touches[0].clientX;
                    clientY = e.touches[0].clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }

                // 如果還沒進入拖曳模式，檢查是否移動太遠（取消長按）
                if (!dragState.active) {
                    const dx = Math.abs(clientX - dragState.startX);
                    const dy = Math.abs(clientY - dragState.startY);
                    if (dx > 10 || dy > 10) {
                        // 移動太遠，取消長按
                        clearTimeout(dragState.longPressTimer);
                        dragState.longPressTimer = null;
                        cleanupDragListeners();
                        dragState.currentId = null;
                    }
                    return;
                }

                // 拖曳模式：阻止滾動
                if (e.cancelable) e.preventDefault();

                // 移動幽靈元素
                if (dragState.ghostEl) {
                    dragState.ghostEl.style.left = (clientX - 70) + 'px';
                    dragState.ghostEl.style.top = (clientY - 70) + 'px';
                }

                // 檢查是否懸停在某個音效卡上
                const elementUnder = document.elementFromPoint(clientX, clientY);
                if (!elementUnder) return;
                const targetCard = elementUnder.closest('.sound-card:not(.add-card)');

                if (targetCard && targetCard !== dragState.placeholderEl) {
                    const targetId = parseInt(targetCard.dataset.id);
                    if (targetId === dragState.currentId) return;

                    // 交換位置
                    swapCards(dragState.currentId, targetId);
                }
            }

            function onPointerUp(e) {
                if (dragState.longPressTimer) {
                    clearTimeout(dragState.longPressTimer);
                    dragState.longPressTimer = null;
                }

                if (dragState.active) {
                    endDrag();
                } else {
                    // 沒有觸發拖曳，清理監聽
                    cleanupDragListeners();
                }

                dragState.currentId = null;
            }

            function startDrag(el, clientX, clientY) {
                dragState.active = true;
                dragState.longPressTimer = null;

                // 加入拖曳狀態
                el.classList.add('long-pressing');
                document.body.classList.add('dragging-active');

                // 建立幽靈元素（複製卡片）
                const rect = el.getBoundingClientRect();
                const ghost = el.cloneNode(true);
                ghost.className = 'sound-card drag-ghost';
                ghost.style.width = rect.width + 'px';
                ghost.style.height = rect.height + 'px';
                ghost.style.left = (clientX - rect.width / 2) + 'px';
                ghost.style.top = (clientY - rect.height / 2) + 'px';
                ghost.style.borderColor = el.style.borderColor || 'rgba(200, 180, 160, 0.15)';
                document.body.appendChild(ghost);
                dragState.ghostEl = ghost;

                // 原卡片變成半透明佔位
                el.classList.add('dragging');
                dragState.placeholderEl = el;

                // 震動回饋（手機支援）
                if (navigator.vibrate) {
                    navigator.vibrate(30);
                }
            }

            function swapCards(dragId, targetId) {
                const dragIdx = sounds.findIndex(s => s.id === dragId);
                const targetIdx = sounds.findIndex(s => s.id === targetId);
                if (dragIdx === -1 || targetIdx === -1) return;

                // 交換陣列中的位置
                const temp = sounds[dragIdx];
                sounds[dragIdx] = sounds[targetIdx];
                sounds[targetIdx] = temp;

                // 更新順序
                sounds.forEach((s, i) => {
                    s.order = i + 1;
                });

                // 重新渲染（不重新綁定事件，避免影響拖曳）
                renderCardsOnly();

                // 重新找到佔位元素
                const newEl = grid.querySelector(`.sound-card[data-id="${dragId}"]`);
                if (newEl) {
                    newEl.classList.add('dragging');
                    dragState.placeholderEl = newEl;
                }
            }

            // 只重新渲染卡片，不重新綁定事件
            function renderCardsOnly() {
                const items = [];
                sounds.forEach((sound) => {
                    items.push({ type: 'sound', data: sound });
                });
                if (sounds.length < MAX_SOUNDS) {
                    items.push({ type: 'add' });
                }

                let html = '';
                items.forEach((item) => {
                    if (item.type === 'add') {
                        html += `
                            <div class="sound-card add-card" id="addCard">
                                <div class="add-icon">＋</div>
                                <div class="add-text">新增音效</div>
                            </div>
                        `;
                    } else {
                        const s = item.data;
                        const color = s.color || COLOR_PALETTE[0];

                        let imageHtml = '';
                        if (s.image && s.image.startsWith('data:image')) {
                            imageHtml = `<img src="${s.image}" alt="${s.name}" />`;
                        } else {
                            imageHtml = `<span class="default-icon">${DEFAULT_ICON}</span>`;
                        }

                        html += `
                            <div class="sound-card" data-id="${s.id}" style="border-color:${color}40;">
                                <div class="card-color" style="background:${color};"></div>
                                <div class="card-image">${imageHtml}</div>
                                <div class="card-name">${escapeHtml(s.name)}</div>
                                <div class="card-actions">
                                    <button class="btn-icon edit" data-id="${s.id}" title="編輯">✏️</button>
                                    <button class="btn-icon delete" data-id="${s.id}" title="刪除">✕</button>
                                </div>
                            </div>
                        `;
                    }
                });

                grid.innerHTML = html;

                // 重新綁定事件
                grid.querySelectorAll('.sound-card:not(.add-card)').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.closest('.card-actions')) return;
                        if (dragState.active) return;
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            playSound(id);
                        }
                    });
                    setupDragEvents(el);
                });

                grid.querySelectorAll('.btn-icon.edit').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            openEditModal(id);
                        }
                    });
                });

                grid.querySelectorAll('.btn-icon.delete').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        if (!isNaN(id)) {
                            deleteSound(id);
                        }
                    });
                });

                const addCard = document.getElementById('addCard');
                if (addCard) {
                    addCard.addEventListener('click', openAddModal);
                }
            }

            async function endDrag() {
                dragState.active = false;
                document.body.classList.remove('dragging-active');

                // 移除幽靈元素
                if (dragState.ghostEl) {
                    dragState.ghostEl.remove();
                    dragState.ghostEl = null;
                }

                // 移除拖曳狀態
                grid.querySelectorAll('.sound-card').forEach(el => {
                    el.classList.remove('dragging', 'long-pressing', 'drag-over');
                });

                // 儲存新順序到 IndexedDB
                try {
                    for (let i = 0; i < sounds.length; i++) {
                        const s = sounds[i];
                        s.order = i + 1;
                        const data = {
                            name: s.name,
                            audioData: s.audioData,
                            image: s.image,
                            color: s.color,
                            order: s.order,
                        };
                        await updateSound(s.id, data);
                    }
                    console.log('✅ 順序已儲存');
                } catch (e) {
                    console.error('儲存順序失敗:', e);
                }

                dragState.placeholderEl = null;
                cleanupDragListeners();
            }

            function cleanupDragListeners() {
                document.removeEventListener('mousemove', onPointerMove);
                document.removeEventListener('mouseup', onPointerUp);
                document.removeEventListener('touchmove', onPointerMove);
                document.removeEventListener('touchend', onPointerUp);
                document.removeEventListener('touchcancel', onPointerUp);
            }

            // ============================================================
            // 9. CRUD 操作
            // ============================================================

            async function addSound(name, audioData, imageData, color) {
                if (sounds.length >= MAX_SOUNDS) {
                    alert(`已達上限 ${MAX_SOUNDS} 個音效！`);
                    return false;
                }
                if (!name.trim()) {
                    alert('請輸入音效名稱！');
                    return false;
                }
                if (!audioData) {
                    alert('請上傳音效檔案！');
                    return false;
                }

                try {
                    const newOrder = sounds.length + 1;
                    const newId = await saveSound({
                        name: name.trim(),
                        audioData: audioData,
                        image: imageData || null,
                        color: color || COLOR_PALETTE[sounds.length % COLOR_PALETTE.length],
                        order: newOrder,
                    });

                    sounds.push({
                        id: newId,
                        name: name.trim(),
                        audioData: audioData,
                        image: imageData || null,
                        color: color || COLOR_PALETTE[sounds.length % COLOR_PALETTE.length],
                        order: newOrder,
                    });

                    render();
                    return true;
                } catch (e) {
                    console.error('儲存失敗:', e);
                    alert('儲存失敗，請檢查瀏覽器空間是否足夠。');
                    return false;
                }
            }

            async function editSound(id, newName, newImage, newColor) {
                const idx = sounds.findIndex(s => s.id === id);
                if (idx === -1) return false;
                if (!newName.trim()) {
                    alert('請輸入音效名稱！');
                    return false;
                }

                try {
                    const updated = {
                        name: newName.trim(),
                        audioData: sounds[idx].audioData,
                        image: newImage !== undefined ? newImage : sounds[idx].image,
                        color: newColor || sounds[idx].color,
                        order: sounds[idx].order,
                    };
                    await updateSound(id, updated);

                    sounds[idx].name = newName.trim();
                    if (newImage !== undefined) sounds[idx].image = newImage;
                    if (newColor) sounds[idx].color = newColor;

                    render();
                    return true;
                } catch (e) {
                    console.error('更新失敗:', e);
                    alert('更新失敗，請稍後再試。');
                    return false;
                }
            }

            async function deleteSound(id) {
                const sound = sounds.find(s => s.id === id);
                if (!sound) return;
                if (!confirm(`確定要刪除「${sound.name}」嗎？`)) return;

                try {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                        currentAudio = null;
                    }

                    await deleteSoundFromDB(id);
                    sounds = sounds.filter(s => s.id !== id);
                    // 重新編號 order
                    sounds.forEach((s, i) => {
                        s.order = i + 1;
                    });
                    render();
                } catch (e) {
                    console.error('刪除失敗:', e);
                    alert('刪除失敗，請稍後再試。');
                }
            }

            async function clearAll() {
                if (sounds.length === 0) return;
                if (!confirm('確定要刪除全部音效嗎？此操作無法復原！')) return;

                try {
                    if (currentAudio) {
                        currentAudio.pause();
                        currentAudio.currentTime = 0;
                        currentAudio = null;
                    }

                    await clearAllSounds();
                    sounds = [];
                    render();
                } catch (e) {
                    console.error('清空失敗:', e);
                    alert('清空失敗，請稍後再試。');
                }
            }

            // ============================================================
            // 10. Modal 控制
            // ============================================================

            function openModal(title, confirmText, callback) {
                modalTitle.textContent = title;
                modalConfirm.textContent = confirmText;
                modalOverlay.classList.add('active');

                inputName.value = '';
                inputAudio.value = '';
                inputImage.value = '';
                imageDataUrl = null;
                tempAudioData = null;
                selectedColor = COLOR_PALETTE[0];
                updateColorPicker(selectedColor);
                updatePreview('🎵', '音效名稱');

                modalConfirm._callback = callback;
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                editingIndex = null;
                tempAudioData = null;
            }

            function openAddModal() {
                editingIndex = null;
                openModal('➕ 新增音效', '✓ 儲存', function() {
                    const name = inputName.value.trim();
                    const audioFile = inputAudio.files[0];
                    const imageFile = inputImage.files[0];

                    if (!name) { alert('請輸入音效名稱！'); return false; }
                    if (!audioFile) { alert('請上傳音效檔案！'); return false; }

                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const audioData = e.target.result;
                        let imagePromise = Promise.resolve(null);
                        if (imageFile) {
                            imagePromise = new Promise((resolve) => {
                                const imgReader = new FileReader();
                                imgReader.onload = function(ev) {
                                    resolve(ev.target.result);
                                };
                                imgReader.readAsDataURL(imageFile);
                            });
                        }

                        imagePromise.then((imageData) => {
                            addSound(name, audioData, imageData, selectedColor);
                            closeModal();
                        });
                    };
                    reader.readAsDataURL(audioFile);
                    return true;
                });
            }

            function openEditModal(id) {
                const sound = sounds.find(s => s.id === id);
                if (!sound) return;

                editingIndex = id;
                inputName.value = sound.name;
                selectedColor = sound.color || COLOR_PALETTE[0];
                imageDataUrl = sound.image || null;

                const iconHtml = sound.image && sound.image.startsWith('data:image') ?
                    `<img src="${sound.image}" />` :
                    DEFAULT_ICON;
                updatePreview(iconHtml, sound.name);
                updateColorPicker(selectedColor);

                inputAudio.value = '';
                inputImage.value = '';
                tempAudioData = null;

                modalTitle.textContent = '✏️ 編輯音效';
                modalConfirm.textContent = '✓ 更新';

                modalOverlay.classList.add('active');

                modalConfirm._callback = function() {
                    const newName = inputName.value.trim();
                    if (!newName) { alert('請輸入音效名稱！'); return false; }

                    const imageFile = inputImage.files[0];
                    if (imageFile) {
                        const imgReader = new FileReader();
                        imgReader.onload = function(e) {
                            const newImage = e.target.result;
                            editSound(id, newName, newImage, selectedColor);
                            closeModal();
                        };
                        imgReader.readAsDataURL(imageFile);
                    } else {
                        editSound(id, newName, sound.image, selectedColor);
                        closeModal();
                    }
                    return true;
                };
            }

            // ============================================================
            // 11. 顏色選擇器
            // ============================================================

            function initColorPicker() {
                colorPicker.innerHTML = '';
                COLOR_PALETTE.forEach((color) => {
                    const div = document.createElement('div');
                    div.className = 'color-option';
                    div.style.background = color;
                    div.dataset.color = color;
                    if (color === selectedColor) div.classList.add('active');
                    div.addEventListener('click', function() {
                        selectedColor = color;
                        updateColorPicker(color);
                    });
                    colorPicker.appendChild(div);
                });
            }

            function updateColorPicker(color) {
                colorPicker.querySelectorAll('.color-option').forEach(el => {
                    el.classList.toggle('active', el.dataset.color === color);
                });
                selectedColor = color;
            }

            // ============================================================
            // 12. 預覽更新
            // ============================================================

            function updatePreview(iconHtml, name) {
                if (typeof iconHtml === 'string' && iconHtml.startsWith('<img')) {
                    previewIcon.innerHTML = iconHtml;
                } else if (typeof iconHtml === 'string' && iconHtml.startsWith('data:image')) {
                    previewIcon.innerHTML = `<img src="${iconHtml}" />`;
                } else {
                    previewIcon.innerHTML = iconHtml || DEFAULT_ICON;
                }
                previewName.textContent = name || '音效名稱';
            }

            inputName.addEventListener('input', function() {
                const name = this.value.trim() || '音效名稱';
                const iconHtml = imageDataUrl && imageDataUrl.startsWith('data:image') ?
                    `<img src="${imageDataUrl}" />` :
                    DEFAULT_ICON;
                updatePreview(iconHtml, name);
            });

            inputImage.addEventListener('change', function() {
                const file = this.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        imageDataUrl = e.target.result;
                        const name = inputName.value.trim() || '音效名稱';
                        updatePreview(`<img src="${imageDataUrl}" />`, name);
                    };
                    reader.readAsDataURL(file);
                } else {
                    imageDataUrl = null;
                    const name = inputName.value.trim() || '音效名稱';
                    updatePreview(DEFAULT_ICON, name);
                }
            });

            // ============================================================
            // 13. 事件綁定
            // ============================================================

            addBtn.addEventListener('click', openAddModal);
            clearBtn.addEventListener('click', clearAll);
            modalCancel.addEventListener('click', closeModal);

            modalConfirm.addEventListener('click', function() {
                const callback = this._callback;
                if (callback) {
                    const result = callback();
                    if (result === false) return;
                }
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'Enter' && modalOverlay.classList.contains('active')) {
                    const callback = modalConfirm._callback;
                    if (callback) {
                        const result = callback();
                        if (result === false) return;
                    }
                }
            });

            // ============================================================
            // 14. 啟動
            // ============================================================

            init();

        })();
    </script>
