<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🙏 擲筊問事</title>
    <style>
        /* ===== 全域重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Microsoft JhengHei', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #2c1810;
            padding: 20px;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(180, 80, 40, 0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(180, 80, 40, 0.10) 0%, transparent 60%),
                repeating-linear-gradient(45deg, rgba(200, 150, 100, 0.03) 0px, rgba(200, 150, 100, 0.03) 2px, transparent 2px, transparent 8px);
        }

        .container {
            max-width: 520px;
            width: 100%;
            background: linear-gradient(170deg, #5c2a1a 0%, #3d1a0e 100%);
            border-radius: 48px;
            padding: 32px 28px 36px 28px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 200, 150, 0.15),
                0 0 80px rgba(180, 80, 40, 0.15);
            border: 1px solid rgba(200, 150, 100, 0.25);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            right: 8px;
            bottom: 8px;
            border: 1px solid rgba(200, 170, 120, 0.15);
            border-radius: 40px;
            pointer-events: none;
        }

        .temple-glow {
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at center, rgba(255, 200, 80, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #f5e6c8;
            letter-spacing: 6px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
        }

        .header .sub {
            font-size: 13px;
            color: #c4a88a;
            letter-spacing: 3px;
            margin-top: 4px;
            opacity: 0.7;
        }

        .divider {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, #c4a88a, transparent);
            margin: 10px auto 0 auto;
            opacity: 0.4;
        }

        /* ===== 開場畫面 ===== */
        #introScreen {
            text-align: center;
            padding: 30px 10px 20px 10px;
            position: relative;
            z-index: 1;
        }

        #introScreen .pray-icon {
            font-size: 52px;
            display: block;
            margin-bottom: 16px;
            animation: floatY 3s ease-in-out infinite;
        }

        @keyframes floatY {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }

        #introScreen .pray-text {
            font-size: 20px;
            color: #f5e6c8;
            font-weight: 300;
            letter-spacing: 2px;
            line-height: 1.8;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        #introScreen .pray-text small {
            display: block;
            font-size: 14px;
            color: #c4a88a;
            margin-top: 6px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .btn {
            display: inline-block;
            padding: 14px 44px;
            font-size: 18px;
            font-weight: 600;
            color: #3d1a0e;
            background: linear-gradient(180deg, #f5dca8 0%, #dbb87a 100%);
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow:
                0 6px 0 #8a6a3a,
                0 8px 24px rgba(0, 0, 0, 0.3);
            letter-spacing: 2px;
            position: relative;
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #8a6a3a, 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8a6a3a, 0 4px 12px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.4;
            transform: translateY(4px);
            box-shadow: 0 2px 0 #8a6a3a;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-start {
            margin-top: 28px;
            padding: 16px 56px;
            font-size: 20px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 18px;
        }

        .btn-sm {
            padding: 10px 28px;
            font-size: 15px;
            min-width: 100px;
        }

        .btn-sm.btn-secondary {
            background: linear-gradient(180deg, #c4a88a 0%, #a8876a 100%);
            box-shadow: 0 4px 0 #6a5040;
            color: #f5e6c8;
        }

        .btn-sm.btn-secondary:hover {
            box-shadow: 0 6px 0 #6a5040;
        }

        .btn-sm.btn-secondary:active {
            box-shadow: 0 2px 0 #6a5040;
        }

        /* ===== 遊戲主畫面 ===== */
        #gameScreen {
            display: none;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* ===== 筊的容器（3D 場景） ===== */
        .jiao-container {
            perspective: 800px;
            width: 100%;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            margin: 10px 0 16px 0;
            position: relative;
        }

        .jiao {
            width: 70px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
            cursor: default;
        }

        /* ===== 筊的兩個面 — 加強區別 ===== */

        /* 正面（平）— 淺色、亮面、金色邊 */
        .jiao-face.flat {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 40% 40% 20% 20% / 60% 60% 30% 30%;
            backface-visibility: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            transform: rotateX(0deg);
            /* 淺紅褐色 — 亮面 */
            background: radial-gradient(ellipse at 40% 30%, #e8b88a, #c49060 50%, #b0784a 100%);
            box-shadow:
                inset 0 -8px 30px rgba(0, 0, 0, 0.25),
                inset 0 8px 30px rgba(255, 220, 180, 0.4),
                0 4px 20px rgba(0, 0, 0, 0.3),
                inset 0 0 0 2px rgba(255, 215, 140, 0.3);
            color: rgba(255, 240, 210, 0.9);
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        /* 正面加註「平」字樣（小標記） */
        .jiao-face.flat::before {
            content: '▔';
            position: absolute;
            bottom: 12px;
            font-size: 18px;
            color: rgba(255, 220, 180, 0.3);
            letter-spacing: 4px;
        }

        /* 反面（凸）— 深色、霧面、無光澤 */
        .jiao-face.convex {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 40% 40% 20% 20% / 60% 60% 30% 30%;
            backface-visibility: visible;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: 700;
            transform: rotateX(180deg);
            /* 深紅褐色 — 霧面 */
            background: radial-gradient(ellipse at 40% 30%, #7a4a32, #4a2a1a 50%, #2a140a 100%);
            box-shadow:
                inset 0 -8px 30px rgba(0, 0, 0, 0.6),
                inset 0 4px 15px rgba(0, 0, 0, 0.3),
                0 4px 20px rgba(0, 0, 0, 0.4);
            color: rgba(160, 120, 90, 0.4);
            text-shadow: none;
        }

        /* 反面加註「凸」字樣（小標記） */
        .jiao-face.convex::before {
            content: '▁';
            position: absolute;
            bottom: 12px;
            font-size: 18px;
            color: rgba(160, 120, 90, 0.2);
            letter-spacing: 4px;
        }

        /* 筊的底部陰影 */
        .jiao-face::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 35%;
            height: 10px;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 50%;
            filter: blur(6px);
        }

        /* ===== 旋轉動畫 ===== */
        .jiao.spinning {
            animation: jiaoSpin 1.8s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
        }

        @keyframes jiaoSpin {
            0% {
                transform: rotateX(0deg) rotateZ(0deg) rotateY(0deg) scale(1);
            }
            15% {
                transform: rotateX(120deg) rotateZ(15deg) rotateY(30deg) scale(1.05);
            }
            30% {
                transform: rotateX(240deg) rotateZ(-10deg) rotateY(-20deg) scale(0.95);
            }
            50% {
                transform: rotateX(400deg) rotateZ(20deg) rotateY(40deg) scale(1.02);
            }
            70% {
                transform: rotateX(560deg) rotateZ(-15deg) rotateY(-30deg) scale(0.98);
            }
            85% {
                transform: rotateX(680deg) rotateZ(8deg) rotateY(15deg) scale(1.01);
            }
            100% {
                transform: rotateX(720deg) rotateZ(0deg) rotateY(0deg) scale(1);
            }
        }

        /* ===== 結果靜止樣式 ===== */
        .jiao.result-sheng {
            transform: rotateX(0deg) rotateZ(0deg);
        }
        .jiao.result-xiao {
            transform: rotateX(0deg) rotateZ(0deg);
        }
        .jiao.result-yin {
            transform: rotateX(180deg) rotateZ(0deg);
        }

        /* 筊的標籤 */
        .jiao-label {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 11px;
            color: #c4a88a;
            letter-spacing: 2px;
            opacity: 0.5;
            white-space: nowrap;
        }

        /* ===== 結果顯示 ===== */
        #resultDisplay {
            margin: 12px 0 6px 0;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            border: 1px solid rgba(200, 150, 100, 0.15);
            min-height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        #resultDisplay .result-icon {
            font-size: 38px;
            margin-bottom: 4px;
        }

        #resultDisplay .result-name {
            font-size: 24px;
            font-weight: 700;
            color: #f5e6c8;
            letter-spacing: 2px;
        }

        #resultDisplay .result-name.sheng {
            color: #f5dca8;
        }
        #resultDisplay .result-name.xiao {
            color: #c4a88a;
        }
        #resultDisplay .result-name.yin {
            color: #a08070;
        }

        #resultDisplay .result-desc {
            font-size: 15px;
            color: #c4a88a;
            margin-top: 4px;
            line-height: 1.5;
        }

        #resultDisplay .result-prob {
            font-size: 13px;
            color: #8a7a6a;
            margin-top: 2px;
            opacity: 0.7;
        }

        /* ===== 連續紀錄 ===== */
        #streakDisplay {
            font-size: 14px;
            color: #c4a88a;
            margin-top: 8px;
            padding: 6px 16px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 40px;
            display: inline-block;
            opacity: 0.6;
            letter-spacing: 1px;
        }

        #streakDisplay .highlight-sheng {
            color: #f5dca8;
            font-weight: 600;
        }

        #streakDisplay .highlight-yin {
            color: #a08070;
            font-weight: 600;
        }

        /* ===== 花瓣特效 ===== */
        .petal-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .petal {
            position: absolute;
            width: 12px;
            height: 18px;
            background: radial-gradient(ellipse at 30% 30%, #ffd700, #d4a017);
            border-radius: 50% 0 50% 0;
            opacity: 0;
            animation: petalFall 3.5s ease-out forwards;
            transform-origin: center;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .petal:nth-child(odd) {
            border-radius: 0 50% 0 50%;
            background: radial-gradient(ellipse at 30% 30%, #ffec8a, #d4a017);
        }

        @keyframes petalFall {
            0% {
                opacity: 0;
                transform: translateY(-20px) rotate(0deg) scale(0.5);
            }
            10% {
                opacity: 1;
                transform: translateY(0px) rotate(20deg) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(calc(100vh + 50px)) rotate(720deg) scale(0.3);
            }
        }

        /* ===== 提醒彈窗 ===== */
        .reminder-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            padding: 20px;
        }

        .reminder-overlay.active {
            display: flex;
        }

        .reminder-box {
            background: linear-gradient(170deg, #3d1a0e, #2c1810);
            border-radius: 32px;
            padding: 40px 36px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(200, 150, 100, 0.2);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            animation: popIn 0.4s ease;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .reminder-box .icon {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        .reminder-box .title {
            font-size: 22px;
            font-weight: 700;
            color: #f5e6c8;
            letter-spacing: 2px;
        }

        .reminder-box .desc {
            font-size: 16px;
            color: #c4a88a;
            margin-top: 10px;
            line-height: 1.6;
        }

        .reminder-box .btn {
            margin-top: 20px;
            padding: 12px 36px;
            font-size: 16px;
        }

        .footer-text {
            text-align: center;
            font-size: 12px;
            color: #6a5040;
            margin-top: 18px;
            letter-spacing: 1px;
            opacity: 0.5;
            position: relative;
            z-index: 1;
        }

        /* ===== 圖例 ===== */
        .legend-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #8a7a6a;
            opacity: 0.6;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
            flex-wrap: wrap;
        }

        .legend-bar span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .legend-bar .dot-flat {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: radial-gradient(ellipse at 40% 30%, #e8b88a, #b0784a);
            border-radius: 4px;
            border: 1px solid rgba(255, 215, 140, 0.3);
        }

        .legend-bar .dot-convex {
            display: inline-block;
            width: 16px;
            height: 16px;
            background: radial-gradient(ellipse at 40% 30%, #7a4a32, #2a140a);
            border-radius: 4px;
            border: 1px solid rgba(0, 0, 0, 0.3);
        }

        /* ===== 響應式 ===== */
        @media (max-width: 480px) {
            .container {
                padding: 20px 16px 24px 16px;
                border-radius: 32px;
            }
            .header h1 {
                font-size: 22px;
                letter-spacing: 4px;
            }
            .jiao-container {
                height: 160px;
                gap: 24px;
            }
            .jiao {
                width: 56px;
                height: 80px;
            }
            .jiao-face.flat,
            .jiao-face.convex {
                font-size: 22px;
            }
            #introScreen .pray-text {
                font-size: 17px;
            }
            #resultDisplay .result-name {
                font-size: 20px;
            }
            .btn-start {
                padding: 14px 40px;
                font-size: 17px;
            }
            .btn-sm {
                padding: 8px 18px;
                font-size: 13px;
                min-width: 70px;
            }
            .reminder-box {
                padding: 28px 20px;
            }
            .reminder-box .title {
                font-size: 19px;
            }
            .legend-bar {
                font-size: 10px;
                gap: 12px;
            }
        }

        @media (max-width: 380px) {
            .jiao-container {
                gap: 16px;
            }
            .jiao {
                width: 44px;
                height: 64px;
            }
            .jiao-face.flat,
            .jiao-face.convex {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
         <!-- 👇 放在 container 裡面、標題前面 -->
    <a href="../index.html" style="display: inline-block; color: #8a7a6a; text-decoration: none; font-size: 14px; margin-bottom: 10px; transition: 0.2s;" onmouseover="this.style.color='#5a4a3a'" onmouseout="this.style.color='#8a7a6a'">← 回到遊戲列表</a>
        <div class="temple-glow"></div>

        <div class="header">
            <h1>🙏 擲筊問事</h1>
            <div class="sub">誠心請示 · 神明顯化</div>
            <div class="divider"></div>
        </div>

        <!-- ===== 開場畫面 ===== -->
        <div id="introScreen">
            <span class="pray-icon">🕯️</span>
            <div class="pray-text">
                請心中默念想問的問題
                <small>心誠則靈 · 專注一念</small>
            </div>
            <button class="btn btn-start" id="btnStart">開始擲筊</button>
        </div>

        <!-- ===== 遊戲主畫面 ===== -->
        <div id="gameScreen">
            <div class="jiao-container" id="jiaoContainer">
                <div class="jiao" id="jiaoLeft">
                    <div class="jiao-face flat" id="leftFlat">☯</div>
                    <div class="jiao-face convex" id="leftConvex">☯</div>
                    <span class="jiao-label">左</span>
                </div>
                <div class="jiao" id="jiaoRight">
                    <div class="jiao-face flat" id="rightFlat">☯</div>
                    <div class="jiao-face convex" id="rightConvex">☯</div>
                    <span class="jiao-label">右</span>
                </div>
            </div>

            <!-- 圖例 -->
            <div class="legend-bar">
                <span><span class="dot-flat"></span> 平（正面）</span>
                <span><span class="dot-convex"></span> 凸（反面）</span>
                <span>🌙 聖筊 = 平＋凸</span>
            </div>

            <div id="resultDisplay">
                <div class="result-icon" id="resultIcon">🌙</div>
                <div class="result-name" id="resultName">等待擲筊</div>
                <div class="result-desc" id="resultDesc">點擊下方按鈕開始</div>
                <div class="result-prob" id="resultProb"></div>
            </div>

            <div id="streakDisplay">📿 連續紀錄：<span id="streakText">無</span></div>

            <div class="btn-group">
                <button class="btn btn-sm" id="btnThrow">🌙 擲筊</button>
                <button class="btn btn-sm btn-secondary" id="btnReset">🔄 重新開始</button>
            </div>
        </div>

        <div class="footer-text">— 心誠則靈 · 一正一反為聖筊 —</div>
    </div>

    <div class="petal-container" id="petalContainer"></div>

    <div class="reminder-overlay" id="reminderOverlay">
        <div class="reminder-box">
            <span class="icon">🙏</span>
            <div class="title">靜心片刻</div>
            <div class="desc" id="reminderDesc">連續三次陰筊，建議重新思考問題，或過段時間再來問事。</div>
            <button class="btn" id="reminderBtn">我知道了</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 1. DOM 元素
            // ============================================================
            const introScreen = document.getElementById('introScreen');
            const gameScreen = document.getElementById('gameScreen');
            const btnStart = document.getElementById('btnStart');
            const btnThrow = document.getElementById('btnThrow');
            const btnReset = document.getElementById('btnReset');

            const jiaoLeft = document.getElementById('jiaoLeft');
            const jiaoRight = document.getElementById('jiaoRight');
            const leftFlat = document.getElementById('leftFlat');
            const leftConvex = document.getElementById('leftConvex');
            const rightFlat = document.getElementById('rightFlat');
            const rightConvex = document.getElementById('rightConvex');

            const resultIcon = document.getElementById('resultIcon');
            const resultName = document.getElementById('resultName');
            const resultDesc = document.getElementById('resultDesc');
            const resultProb = document.getElementById('resultProb');
            const streakText = document.getElementById('streakText');

            const petalContainer = document.getElementById('petalContainer');
            const reminderOverlay = document.getElementById('reminderOverlay');
            const reminderDesc = document.getElementById('reminderDesc');
            const reminderBtn = document.getElementById('reminderBtn');

            // ============================================================
            // 2. 遊戲狀態
            // ============================================================
            const state = {
                isSpinning: false,
                streak: [],
                maxStreak: 3,
                isFirstThrow: true,
            };

            // ============================================================
            // 3. 結果資料
            // ============================================================
            const RESULTS = {
                sheng: {
                    icon: '🌙',
                    name: '聖筊',
                    nameClass: 'sheng',
                    desc: '神明應允，諸事可行！',
                    prob: '機率 33.3%',
                    emoji: '🌙',
                },
                xiao: {
                    icon: '🌘',
                    name: '笑筊',
                    nameClass: 'xiao',
                    desc: '神明笑而不答，時機未到。',
                    prob: '機率 33.3%',
                    emoji: '🌘',
                },
                yin: {
                    icon: '🌑',
                    name: '陰筊',
                    nameClass: 'yin',
                    desc: '神明不予認同，建議暫緩。',
                    prob: '機率 33.3%',
                    emoji: '🌑',
                },
            };

            // ============================================================
            // 4. 音效
            // ============================================================
            let audioCtx = null;

            function playSound() {
                try {
                    if (!audioCtx) {
                        audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    }
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.frequency.setValueAtTime(1200, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.04);

                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                    osc.start(audioCtx.currentTime);
                    osc.stop(audioCtx.currentTime + 0.12);

                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.setValueAtTime(900, audioCtx.currentTime + 0.06);
                    osc2.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.10);
                    gain2.gain.setValueAtTime(0.12, audioCtx.currentTime + 0.06);
                    gain2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.16);
                    osc2.start(audioCtx.currentTime + 0.06);
                    osc2.stop(audioCtx.currentTime + 0.16);

                } catch (e) {}
            }

            // ============================================================
            // 5. 核心邏輯 — 三種結果均等（各 33.33%）
            // ============================================================

            function getRandomResult() {
                const r = Math.random();
                if (r < 0.3333) return 'sheng';
                if (r < 0.6666) return 'xiao';
                return 'yin';
            }

            function setJiaoResult(result) {
                jiaoLeft.classList.remove('result-sheng', 'result-xiao', 'result-yin');
                jiaoRight.classList.remove('result-sheng', 'result-xiao', 'result-yin');
                jiaoLeft.classList.remove('spinning');
                jiaoRight.classList.remove('spinning');
                jiaoLeft.style.transform = '';
                jiaoRight.style.transform = '';

                if (result === 'sheng') {
                    jiaoLeft.classList.add('result-sheng');
                    jiaoRight.classList.add('result-sheng');
                    leftFlat.style.display = 'flex';
                    leftConvex.style.display = 'none';
                    rightFlat.style.display = 'none';
                    rightConvex.style.display = 'flex';
                } else if (result === 'xiao') {
                    jiaoLeft.classList.add('result-xiao');
                    jiaoRight.classList.add('result-xiao');
                    leftFlat.style.display = 'flex';
                    leftConvex.style.display = 'none';
                    rightFlat.style.display = 'flex';
                    rightConvex.style.display = 'none';
                } else {
                    jiaoLeft.classList.add('result-yin');
                    jiaoRight.classList.add('result-yin');
                    leftFlat.style.display = 'none';
                    leftConvex.style.display = 'flex';
                    rightFlat.style.display = 'none';
                    rightConvex.style.display = 'flex';
                }
            }

            function resetJiao() {
                jiaoLeft.classList.remove('spinning', 'result-sheng', 'result-xiao', 'result-yin');
                jiaoRight.classList.remove('spinning', 'result-sheng', 'result-xiao', 'result-yin');
                jiaoLeft.style.transform = '';
                jiaoRight.style.transform = '';
                leftFlat.style.display = 'flex';
                leftConvex.style.display = 'none';
                rightFlat.style.display = 'flex';
                rightConvex.style.display = 'none';
            }

            function displayResult(resultKey) {
                const data = RESULTS[resultKey];
                resultIcon.textContent = data.icon;
                resultName.textContent = data.name;
                resultName.className = 'result-name ' + data.nameClass;
                resultDesc.textContent = data.desc;
                resultProb.textContent = data.prob;
            }

            function updateStreak(resultKey) {
                state.streak.push(resultKey);
                if (state.streak.length > state.maxStreak) {
                    state.streak.shift();
                }

                if (state.streak.length === 0) {
                    streakText.textContent = '無';
                    streakText.className = '';
                    return;
                }

                const lastThree = state.streak.slice(-state.maxStreak);
                let html = '';
                let allSheng = true;
                let allYin = true;

                lastThree.forEach((r) => {
                    const icon = r === 'sheng' ? '🌙' : r === 'xiao' ? '🌘' : '🌑';
                    html += icon;
                    if (r !== 'sheng') allSheng = false;
                    if (r !== 'yin') allYin = false;
                });

                streakText.textContent = html;

                if (lastThree.length === state.maxStreak) {
                    if (allSheng) {
                        streakText.className = 'highlight-sheng';
                        triggerPetalEffect();
                        return;
                    }
                    if (allYin) {
                        streakText.className = 'highlight-yin';
                        showReminder('連續三次陰筊，建議重新思考問題，或過段時間再來問事。');
                        return;
                    }
                }
                streakText.className = '';
            }

            // ============================================================
            // 6. 特效
            // ============================================================

            function triggerPetalEffect() {
                const container = petalContainer;
                const count = 40;
                container.innerHTML = '';

                for (let i = 0; i < count; i++) {
                    const petal = document.createElement('div');
                    petal.className = 'petal';
                    const size = 8 + Math.random() * 14;
                    petal.style.width = size + 'px';
                    petal.style.height = (size * 1.5) + 'px';
                    petal.style.left = (Math.random() * 100) + '%';
                    petal.style.top = '-10%';
                    petal.style.animationDuration = (2.5 + Math.random() * 2) + 's';
                    petal.style.animationDelay = (Math.random() * 0.8) + 's';
                    petal.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                    petal.style.opacity = 0.6 + Math.random() * 0.4;
                    container.appendChild(petal);
                }

                setTimeout(() => {
                    container.innerHTML = '';
                }, 5000);
            }

            function showReminder(message) {
                reminderDesc.textContent = message;
                reminderOverlay.classList.add('active');
            }

            function closeReminder() {
                reminderOverlay.classList.remove('active');
            }

            // ============================================================
            // 7. 主要流程
            // ============================================================

            function performThrow() {
                if (state.isSpinning) return;

                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                state.isSpinning = true;
                btnThrow.disabled = true;

                setTimeout(() => playSound(), 200);

                jiaoLeft.classList.add('spinning');
                jiaoRight.classList.add('spinning');

                resultIcon.textContent = '🌀';
                resultName.textContent = '擲筊中...';
                resultName.className = 'result-name';
                resultDesc.textContent = '請稍候，神明正在回應';
                resultProb.textContent = '';

                const resultKey = getRandomResult();

                setTimeout(() => {
                    jiaoLeft.classList.remove('spinning');
                    jiaoRight.classList.remove('spinning');
                    setJiaoResult(resultKey);
                    displayResult(resultKey);
                    updateStreak(resultKey);

                    state.isSpinning = false;
                    btnThrow.disabled = false;
                    state.isFirstThrow = false;

                    setTimeout(() => playSound(), 100);

                }, 1800);
            }

            // ============================================================
            // 8. 重置
            // ============================================================

            function resetGame() {
                if (state.isSpinning) return;

                state.streak = [];
                state.isFirstThrow = true;

                resetJiao();

                resultIcon.textContent = '🌙';
                resultName.textContent = '等待擲筊';
                resultName.className = 'result-name';
                resultDesc.textContent = '點擊「擲筊」開始';
                resultProb.textContent = '';
                streakText.textContent = '無';
                streakText.className = '';

                closeReminder();
                petalContainer.innerHTML = '';

                btnThrow.disabled = false;
            }

            // ============================================================
            // 9. 畫面切換
            // ============================================================

            function enterGame() {
                introScreen.style.display = 'none';
                gameScreen.style.display = 'block';
                resetGame();
            }

            // ============================================================
            // 10. 事件綁定
            // ============================================================

            btnStart.addEventListener('click', enterGame);
            btnThrow.addEventListener('click', performThrow);

            btnReset.addEventListener('click', function() {
                if (state.isSpinning) return;
                resetGame();
                introScreen.style.display = 'block';
                gameScreen.style.display = 'none';
                closeReminder();
                petalContainer.innerHTML = '';
            });

            reminderBtn.addEventListener('click', closeReminder);
            reminderOverlay.addEventListener('click', function(e) {
                if (e.target === this) closeReminder();
            });

            document.addEventListener('keydown', function(e) {
                if (e.key === ' ' || e.key === 'Space') {
                    e.preventDefault();
                    if (gameScreen.style.display === 'block' && !state.isSpinning) {
                        performThrow();
                    }
                }
                if (e.key === 'Enter' && introScreen.style.display !== 'none') {
                    enterGame();
                }
                if (e.key === 'Escape') {
                    closeReminder();
                }
            });

            // ============================================================
            // 11. 初始化
            // ============================================================

            resetJiao();
            console.log('🙏 擲筊問事遊戲已載入！');
            console.log('🌙 聖筊 33.3% | 🌘 笑筊 33.3% | 🌑 陰筊 33.3%');

        })();
    </script>
